# 差异清单（单一维护处，供验证与文档引用）
[[differences]]
id = "proportional-defaults"
kind = "intentional"
title = "比例默认数字与等宽 tnum/zero"
basis = "37 个码位默认使用 Inter 比例形态，pnum 不改变默认宽度；tnum（含 U+002D 第 38 码位）与 tnum+zero 严格等宽。"

[[differences]]
id = "inter-context"
kind = "intentional"
title = "保留完整 Inter 上下文规则与原生顺序"
basis = "保留 Inter 的冒号上浮、箭头及 calt/frac/dlig 无动作保护规则，恢复 Inter 原生 lookup 顺序（Left:1 不误上浮，H(H) 开 sups/subs 与 Inter 一致）。"

[[differences]]
id = "regional-punctuation"
kind = "intentional"
title = "中日韩默认标点规则与 bopo 脚本"
basis = "hani/kana/hang/bopo 未指定语言时使用本地区 CJK 标点；bopo 路由防止注音串里的省略号和破折号退回西文形。"

[[differences]]
id = "chws-vchw"
kind = "intentional"
title = "Noto CJK 标点挤压 chws/vchw"
basis = "通过固定 chws_tool 注入，斜体按剪切前的正体形状判断，VF 与静态一致。"

[[differences]]
id = "cyrillic-greek-default-routing"
kind = "intentional"
title = "西里尔、希腊默认语言共享 DFLT 特性"
basis = "补齐上游缺失的 tnum/zero/frac/mark/mkmk，使俄语、希腊语数字可切换等宽且组合重音正确定位。"

[[differences]]
id = "hangul-ccmp-guards"
kind = "intentional"
title = "古韩文 L+V+T 合成保护规则"
basis = "直接继承 Source Han VF 的 ccmp 忽略规则，避免上游静态流程丢规则导致的拆格。"

[[differences]]
id = "upstream-pair-order"
kind = "intentional"
title = "GPOS PairSet 按规范排序"
basis = "修正固定上游未排序 PairSet 导致 HarfBuzz 二分查找漏读字偶距的问题。"

[[differences]]
id = "classical-fixes"
kind = "intentional"
title = "CL 尚古 1.028 全字集、全宽修正与间距基字"
basis = "CL 叠加尚古 1.028 VF；强制修正 巅/拼/绿 等非全宽汉字为 1000（A5）；修正 㪉㪘㪣㪰 GDEF 误标为 mark。"

[[differences]]
id = "os2-metadata-fixes"
kind = "intentional"
title = "OS/2 usMaxContext 与 ulUnicodeRange bit 57 修正"
basis = "按实际布局重算 usMaxContext，置位辅助平面标志 bit 57。"

[[differences]]
id = "heavy-weight"
kind = "intentional"
title = "新增 Heavy（900）字重与独立 A1 Hinting"
basis = "上游 Sarasa Ui 无 Heavy 字重；本项目由 VF 单真相源提供并配独立 hcfg，且按安全预算扩充 cvt 消除 A13 执行中止。"

[[differences]]
id = "vf-single-source-metrics"
kind = "source_vf"
title = "单真相源跟随 Source Han VF 与 Inter VF 数值"
basis = "不再向 Sarasa 静态成品做 13 控点逐单位对齐；保留 Source Han VF 的假名+句读字偶距（A3）、逐字重插值 palt/vpal（A6/A7）与尚古 1.028 VF 原样字形（A14）。"

[[differences]]
id = "upstream-inherited"
kind = "upstream_inherited"
title = "继承自上游且解释得通的细节"
basis = "包括 Ģ、加泰罗尼亚语 l·l、DFLT 无 CJK 语言系统、latn/CAT·MOL·ROM 路由、win 度量 968/241 与 hhea.ascender 969、Android includeFontPadding 上下界、U+22EF 与 OS/2 码页 bit 31。"
