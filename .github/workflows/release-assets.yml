name: 发布资产核验

# Release（含预发布）发布后，在全新环境中下载全部 21 个实际资产，按该 tag 的
# 发布清单逐包、逐成员核验后跑完整单元测试和快速审计。本工作流只读：它通过后，
# 由维护者另行把预发布标为正式版（见 README「发布验收」）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要核验的 tag，如 v1.0.43.2'
        required: true

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: '1'
      SARASA_PYTHON_VENV: ${{ github.workspace }}/.ci-venv
      SARASA_SOURCE_DIR: ${{ github.workspace }}/.build-cache/test-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: 安装完整哈希锁定依赖
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --require-hashes -r requirements-visual.lock
          .ci-venv/bin/python -m pip check
      - name: 校验并准备完整测试来源
        run: .ci-venv/bin/python tools/tests/prepare_sources.py
      # 全部 21 个包：资产摘要、ZIP 成员及其 SHA-256 逐项对照发布清单，再解压字体。
      - name: 取回并核验 Release 资产
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .ci-venv/bin/python tools/fetch_release_fonts.py --all-packages
      - name: 单元测试
        run: |
          .ci-venv/bin/python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tools/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              raise SystemExit('发布资产核验不允许跳过测试：' + repr(result.skipped))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: 快速字体审计
        run: .ci-venv/bin/python tools/check_quick_audit.py
