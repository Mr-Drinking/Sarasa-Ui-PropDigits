name: 单元测试与快速字体审计

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: '1'
      SARASA_PYTHON_VENV: ${{ github.workspace }}/.ci-venv
      SARASA_SOURCE_DIR: ${{ github.workspace }}/.build-cache/test-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: 安装完整哈希锁定依赖
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --require-hashes -r requirements-visual.lock
          .ci-venv/bin/python -m pip check
      - name: 校验并准备完整测试来源
        run: .ci-venv/bin/python tools/tests/prepare_sources.py
      - name: 单元测试
        run: |
          .ci-venv/bin/python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tools/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              raise SystemExit('CI 不允许缺失夹具而跳过测试：' + repr(result.skipped))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: 快速字体审计
        run: .ci-venv/bin/python tools/check_quick_audit.py
