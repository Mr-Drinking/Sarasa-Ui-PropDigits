name: 单元测试与快速字体审计

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: '1'
      SARASA_PYTHON_VENV: ${{ github.workspace }}/.ci-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: 安装完整哈希锁定依赖
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --require-hashes -r requirements-visual.lock
          .ci-venv/bin/python -m pip check
      - name: 校验并准备固定 Inter 来源
        run: .ci-venv/bin/python -c "import sys; sys.path.insert(0, 'tools'); import build_sarasa_ui_propdigits_sc as b; b.ensure_inter_sources()"
      - name: 单元测试
        run: .ci-venv/bin/python -m unittest discover -s tools/tests -v
      - name: 快速字体审计
        run: .ci-venv/bin/python tools/check_quick_audit.py
