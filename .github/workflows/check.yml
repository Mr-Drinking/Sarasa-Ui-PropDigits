name: 单元测试（sarasa_pd）

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 安装精简哈希锁定依赖
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements.lock
          .ci-venv/bin/python -m pip check
      - name: 校验环境隔离与锁文件
        run: .ci-venv/bin/python -E -s -X utf8 -m sarasa_pd env
      - name: 运行 sarasa_pd 单元测试
        run: |
          .ci-venv/bin/python -E -s -X utf8 - <<'PY'
          import unittest

          MIN_TESTS = 45
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun < MIN_TESTS:
              raise SystemExit(f'单元测试数量低于下限：{result.testsRun} < {MIN_TESTS}')
          if result.skipped:
              raise SystemExit('CI 不允许跳过单元测试：' + repr(result.skipped))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
